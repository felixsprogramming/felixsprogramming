<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmelden - BBF-Trading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #3b82f6;
            --accent: #8b5cf6;
            --danger: #ef4444;
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --border-color: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.4);
            --radius-md: 10px;
            --radius-lg: 16px;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2rem;
        }

        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 14px;
            margin-bottom: 0.75rem;
        }

        .brand-icon svg {
            width: 30px;
            height: 30px;
            fill: none;
            stroke: #fff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.7rem 0.9rem;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-primary);
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
        }

        .error-message {
            background-color: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            font-size: 0.875rem;
            padding: 0.7rem 0.9rem;
            border-radius: var(--radius-md);
            margin-bottom: 1.25rem;
            display: none;
            animation: errorSlideIn 0.3s ease;
        }

        @keyframes errorSlideIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn-login {
            width: 100%;
            padding: 0.75rem 1rem;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background-color: var(--primary);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-login:hover:not(:disabled) {
            background-color: var(--primary-dark);
        }

        .btn-login:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-login:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-login.loading .spinner {
            display: inline-block;
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        .footer {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 2rem 1.25rem;
            }

            .brand h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24">
                    <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
                    <polyline points="16 7 22 7 22 13"></polyline>
                </svg>
            </div>
            <h1>BBF-Trading</h1>
            <p>Melden Sie sich an, um fortzufahren</p>
        </div>

        <form id="loginForm" autocomplete="on">
            <div id="errorMessage" class="error-message"></div>

            <div class="form-group">
                <label for="username">Benutzername</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Benutzername eingeben"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Passwort</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Passwort eingeben"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span class="btn-text">Anmelden</span>
                <span class="spinner"></span>
            </button>
        </form>

        <div class="footer">BBF-Trading &ndash; Aktien &amp; News Analyse</div>
    </div>

    <script>
        (function () {
            const form = document.getElementById('loginForm');
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('errorMessage');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');

            // If already logged in, redirect to home
            fetch('/api/auth/status')
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    if (data && data.authenticated) {
                        window.location.href = '/';
                    }
                })
                .catch(function () {
                    // Auth status endpoint not available — stay on login page
                });

            function showError(msg) {
                errorDiv.textContent = msg;
                errorDiv.style.display = 'block';
            }

            function hideError() {
                errorDiv.style.display = 'none';
                errorDiv.textContent = '';
            }

            function setLoading(loading) {
                if (loading) {
                    btn.classList.add('loading');
                    btn.disabled = true;
                } else {
                    btn.classList.remove('loading');
                    btn.disabled = false;
                }
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                hideError();

                var username = usernameInput.value.trim();
                var password = passwordInput.value;

                if (!username || !password) {
                    showError('Bitte geben Sie Benutzername und Passwort ein.');
                    return;
                }

                setLoading(true);

                fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                })
                .then(function (res) {
                    if (res.ok) {
                        return res.json().then(function () {
                            window.location.href = '/';
                        });
                    }
                    return res.json().then(function (data) {
                        throw new Error(data.message || 'Fehler');
                    }).catch(function (parseErr) {
                        if (parseErr.message && parseErr.message !== 'Fehler') {
                            throw parseErr;
                        }
                        if (res.status === 401) {
                            throw new Error('Benutzername oder Passwort ist falsch.');
                        } else if (res.status === 429) {
                            throw new Error('Zu viele Anmeldeversuche. Bitte versuchen Sie es spaeter erneut.');
                        } else {
                            throw new Error('Anmeldung fehlgeschlagen. Bitte versuchen Sie es erneut.');
                        }
                    });
                })
                .catch(function (err) {
                    if (err.message === 'Failed to fetch') {
                        showError('Verbindung zum Server fehlgeschlagen. Bitte pruefen Sie Ihre Internetverbindung.');
                    } else {
                        showError(err.message);
                    }
                })
                .finally(function () {
                    setLoading(false);
                });
            });
        })();
    </script>
</body>
</html>
